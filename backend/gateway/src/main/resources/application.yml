server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: service-auth
          uri: ${SERVICE_AUTH_URI:http://localhost:8081}
          predicates:
            - Path=/auth/**,/oauth2/jwks
        - id: service-agenda
          uri: ${SERVICE_AGENDA_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/agenda/**
        - id: service-user
          uri: ${SERVICE_USER_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/users/**
        - id: service-finance
          uri: ${SERVICE_FINANCE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/finance/**
        - id: service-notification
          uri: ${SERVICE_NOTIFICATION_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**
        - id: service-notes
          uri: ${SERVICE_NOTES_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/notes/**
        - id: service-files
          uri: ${SERVICE_FILES_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/files/**
        - id: service-analytics
          uri: ${SERVICE_ANALYTICS_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/analytics/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OUROBOROS_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
          audiences:
            - ${OUROBOROS_JWT_AUDIENCE:ouroboros}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
