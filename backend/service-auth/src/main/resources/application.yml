server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: service-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${SPRING_DATASOURCE_USERNAME:ouroboros}
    password: ${SPRING_DATASOURCE_PASSWORD:ouroboros}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
