name: Images

# Builda e publica a imagem Docker de cada servico no GitHub Container Registry (GHCR).
# Roda no push para main (apos o merge de release) e sob demanda.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - service-auth
          - service-user
          - service-agenda
          - service-finance
          - service-notification
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action normaliza o nome para minusculas.
          images: ghcr.io/${{ github.repository_owner }}/ouroboros-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
