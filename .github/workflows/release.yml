name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # semantic-release precisa do histórico completo
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec
      - name: Rodar release
        # Usa o GITHUB_TOKEN do Actions (permissoes declaradas no bloco `permissions` acima):
        # consegue dar push do commit de release em main (protecao permite push direto) E
        # criar o GitHub Release. O fine-grained PAT (GH_TOKEN) dava 403 em "create a release".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
