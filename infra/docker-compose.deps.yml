# Dependencias locais de desenvolvimento (DBs/brokers).
# Suba antes de rodar os servicos pela IDE: docker compose -f infra/docker-compose.deps.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: ouroboros-postgres
    environment:
      POSTGRES_USER: ouroboros
      POSTGRES_PASSWORD: ouroboros
      POSTGRES_DB: ouroboros
    ports:
      # Porta do host parametrizavel para conviver com um Postgres local na 5432.
      # Default 5432; sobrescreva com POSTGRES_HOST_PORT se a porta estiver ocupada.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouroboros"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    container_name: ouroboros-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      # EXTERNAL e anunciado como localhost:<porta-do-host> para acesso pela IDE.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ouroboros-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ouroboros
      RABBITMQ_DEFAULT_PASS: ouroboros
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  mongo:
    image: mongo:7
    container_name: ouroboros-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ouroboros
      MONGO_INITDB_ROOT_PASSWORD: ouroboros
    ports:
      # Porta do host parametrizavel para conviver com um Mongo local na 27017.
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # ping nao exige autenticacao mesmo com auth habilitado; confirma o servidor de pe.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  mongodata:
