# Stack completa: Postgres + service-auth + service-agenda + gateway.
# Subir com: docker compose -f infra/docker-compose.yml up --build
# Apenas o gateway expoe porta no host; os servicos conversam pela rede interna.
services:
  postgres:
    image: postgres:16
    container_name: ouroboros-postgres
    environment:
      POSTGRES_USER: ouroboros
      POSTGRES_PASSWORD: ouroboros
      POSTGRES_DB: ouroboros
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouroboros"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    container_name: ouroboros-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ouroboros-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ouroboros
      RABBITMQ_DEFAULT_PASS: ouroboros
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  service-auth:
    build:
      context: ../backend
      dockerfile: service-auth/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: ouroboros
      SPRING_DATASOURCE_PASSWORD: ouroboros
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  service-agenda:
    build:
      context: ../backend
      dockerfile: service-agenda/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agenda
      SPRING_DATASOURCE_USERNAME: ouroboros
      SPRING_DATASOURCE_PASSWORD: ouroboros
      OUROBOROS_JWK_SET_URI: http://service-auth:8081/oauth2/jwks
    depends_on:
      postgres:
        condition: service_healthy
      service-auth:
        condition: service_started

  service-user:
    build:
      context: ../backend
      dockerfile: service-user/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users
      SPRING_DATASOURCE_USERNAME: ouroboros
      SPRING_DATASOURCE_PASSWORD: ouroboros
      OUROBOROS_JWK_SET_URI: http://service-auth:8081/oauth2/jwks
    depends_on:
      postgres:
        condition: service_healthy
      service-auth:
        condition: service_started

  service-finance:
    build:
      context: ../backend
      dockerfile: service-finance/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finance
      SPRING_DATASOURCE_USERNAME: ouroboros
      SPRING_DATASOURCE_PASSWORD: ouroboros
      OUROBOROS_JWK_SET_URI: http://service-auth:8081/oauth2/jwks
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      service-auth:
        condition: service_started
      kafka:
        condition: service_healthy

  gateway:
    build:
      context: ../backend
      dockerfile: gateway/Dockerfile
    environment:
      SERVICE_AUTH_URI: http://service-auth:8081
      SERVICE_AGENDA_URI: http://service-agenda:8082
      SERVICE_USER_URI: http://service-user:8083
      SERVICE_FINANCE_URI: http://service-finance:8084
      OUROBOROS_JWK_SET_URI: http://service-auth:8081/oauth2/jwks
    ports:
      # Porta do host parametrizavel (default 8080) para conviver com a 8080 ocupada.
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      service-auth:
        condition: service_started
      service-agenda:
        condition: service_started
      service-user:
        condition: service_started
      service-finance:
        condition: service_started

volumes:
  pgdata:
